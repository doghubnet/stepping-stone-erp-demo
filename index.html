:root{
  --oxblood:#7a1c1c;--oxblood-600:#8f2323;--oxblood-50:#f7eeec;--oxblood-100:#efdcd8;
  --ink:#18181b;--ink-2:#3d3d44;--ink-3:#6a6a73;--ink-4:#9a9aa2;
  --line:#e7e4df;--line-2:#d9d5cf;
  --surface:#ffffff;--canvas:#f5f3f0;--panel:#faf9f7;
  --ok:#1d7a46;--ok-bg:#e6f2ea;--warn:#a86700;--warn-bg:#fbf0db;--bad:#b3261e;--bad-bg:#fbe7e5;--info:#2257a8;--info-bg:#e5edf8;
  --r-sm:7px;--r:10px;--r-lg:14px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);
  --shadow-pop:0 1px 2px rgba(24,24,27,.06),0 12px 32px -8px rgba(24,24,27,.22);
  --banner:28px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Plex",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--oxblood-100);color:var(--ink)}
:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
a{color:var(--oxblood);text-underline-offset:3px}
.svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

function mkDoc(type,s,cust,lines,date){
  s.seq[type]++;

}

/* landed cost */
function landed(po){
  const fob=po.lines.reduce((a,l)=>a+l.qty*l.usd,0);
  const cifUSD=fob+po.freightUSD+po.insUSD;
  const cifETB=cifUSD*S.fx;
  const duty=cifETB*po.dutyPct/100;
  const surtax=(cifETB+duty)*0.10;
  const vat=(cifETB+duty+surtax)*0.15;
  const wht=cifETB*0.03;
  const landedETB=cifETB+duty+surtax+po.clearingETB; // VAT & WHT are recoverable/creditable
  return{fob,cifUSD,cifETB,duty,surtax,vat,wht,landedETB,landedUSD:landedETB/S.fx,factor:landedETB/(fob*S.fx)};
}

function filterInv(){
  const q=($('#invQ').value||'').toLowerCase().replace(/\s|-/g,''),b=$('#invBrand').value,c=$('#invCat').value,w=$('#invWh').value,st=$('#invStock').value;
  const rows=S.parts.filter(p=>{
    const hay=(p.pn+p.sku+p.name+p.brand+p.models.join(' ')+p.cat).toLowerCase().replace(/\s|-/g,'');
    return(!q||hay.includes(q))&&(!b||p.brand===b)&&(!c||p.cat===c)&&(!w||p.wh===w)&&(!st||p.qty<=p.reorder)});
  $('#invBody').innerHTML=rows.map(p=>`<tr class="click" onclick="App.partModal('${p.sku}')"><td class="mono hide-m">${esc(p.pn)}</td><td style="white-space:normal;min-width:150px"><div class="mono small show-m" style="color:var(--ink-3)">${esc(p.pn)}</div><b>${esc(p.name)}</b><div class="small muted"><span class="show-m">${esc(p.brand)} · </span>${esc(p.cat)}</div></td><td class="hide-m">${brandTag(p.brand)}</td><td class="hide-m small">${esc(p.models.slice(0,2).join(', '))}${p.models.length>2?' +'+(p.models.length-2):''}</td><td class="hide-m small">${p.wh==='NSL'?'Main Yard':'Gofa Counter'} · <span class="mono">${esc(p.bin)}</span></td><td class="num"><b class="${p.qty<=p.reorder?'warn':''}">${p.qty}</b></td><td class="num hide-m">${p.reorder}</td><td class="num">${fmt(p.price)}</td><td class="hide-m">${stockBadge(p)}</td></tr>`).join('')||'<tr><td colspan="9" style="padding:28px"><b>No parts match that search.</b><div class="small muted">Try a machine model (PC200, CA250, XAS 185), a brand, or the OEM number without spaces.</div></td></tr>';
  $('#invCount').textContent=`${rows.length} of ${S.parts.length} items · stock value of shown items ${etb(rows.reduce((a,p)=>a+p.qty*p.cost,0))}`;
}
function partModal(sku){
  const p=part(sku);const mv=S.moves.filter(m=>m.sku===sku).slice(0,8);
  const margin=Math.round((p.price-p.cost)/p.price*100);
  modal(`<div class="modal-head"><div><div class="small muted mono">${esc(p.sku)} · OEM ${esc(p.pn)}</div><h2>${esc(p.name)}</h2><div style="margin-top:6px">${brandTag(p.brand)} ${stockBadge(p)} <span class="small muted">${esc(p.cat)}</span></div></div><button class="x" aria-label="Close" onclick="App.closeModal()">${ic('x')}</button></div>
  <div class="kv"><div><label>On hand</label><b>${p.qty}</b></div><div><label>Reorder level</label><b>${p.reorder}</b></div><div><label>Location</label><b>${esc(S.warehouses[p.wh])}</b></div><div><label>Bin</label><b class="mono">${esc(p.bin)}</b></div><div><label>Landed cost</label><b>${etb(p.cost)}</b></div><div><label>Selling price</label><b>${etb(p.price)}</b></div><div><label>Margin</label><b>${margin}%</b></div><div><label>Stock value</label><b>${etb(p.qty*p.cost)}</b></div></div>
  <h4>Compatible machines</h4><div class="chips">${p.models.map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</div>
  <h4>Recent movements</h4><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th class="num">Qty</th></tr></thead><tbody>${mv.map(m=>`<tr><td>${m.date}</td><td>${moveBadge(m.type)}</td><td>${esc(m.ref)}</td><td class="num"><b>${m.qty>0?'+':''}${m.qty}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="row-actions" style="margin-top:14px"><button class="btn" onclick="App.quickQuote('${p.sku}')">${ic('plus')}Quote this part</button><button class="btn ghost" onclick="App.adjust('${p.sku}')">${ic('sliders')}Adjust stock</button><button class="btn ghost" onclick="App.transfer('${p.sku}')">${ic('move')}Transfer location</button></div>`);
}
function adjust(sku){const p=part(sku);const v=prompt(`Stock count adjustment for ${p.pn}\nCurrent: ${p.qty}. Enter +/- quantity (e.g. -2 or 5):`,'');const n=parseInt(v);if(!n)return;
  if(p.qty+n<0)return toast('Cannot go below zero');p.qty+=n;S.moves.unshift({id:uid('MV'),date:today(),sku,type:'ADJUSTMENT',qty:n,ref:'Manual stock adjustment',wh:p.wh,user:'Parts Desk'});save();toast('Stock adjusted');partModal(sku);if($('#invBody'))filterInv()}
function transfer(sku){const p=part(sku);const to=p.wh==='NSL'?'GOF':'NSL';const v=parseInt(prompt(`Transfer ${p.pn} from ${S.warehouses[p.wh]} to ${S.warehouses[to]}.\nThis demo moves the whole line. Quantity: ${p.qty}. Type YES-equivalent quantity to confirm:`,p.qty));if(!v)return;
  S.moves.unshift({id:uid('MV'),date:today(),sku,type:'TRANSFER',qty:v,ref:`${p.wh} → ${to}`,wh:to,user:'Store Keeper'});p.wh=to;p.bin=to==='GOF'?'G-TR-01':'Y-TR-01';save();toast('Transferred');partModal(sku);if($('#invBody'))filterInv()}

function savePart(){const g=id=>$('#'+id).value.trim();if(!g('np_pn')||!g('np_name'))return toast('Part no. and description required');

  S.parts.push({sku,pn:g('np_pn'),brand:g('np_brand'),cat:g('np_cat'),name:g('np_name'),models:g('np_models').split(',').map(s=>s.trim()).filter(Boolean),wh:g('np_wh'),bin:g('np_bin'),qty:+g('np_qty'),reorder:+g('np_re'),cost:+g('np_cost'),price:+g('np_price')});
  S.moves.unshift({id:uid('MV'),date:today(),sku,type:'OPENING',qty:+g('np_qty'),ref:'New item',wh:g('np_wh'),user:'Parts Desk'});save();closeModal();toast('Part added');route()}

function poModal(no){
  const p=S.pos.find(x=>x.no===no);const L=landed(p);const idx=PO_STEPS.indexOf(p.status);
  modal(`<div class="modal-head"><div><div class="small muted">${esc(p.route)}</div><h2>${p.no} · ${esc(sup(p.sup).name)}</h2><div style="margin-top:6px">${statusBadge(p.status)} <span class="small muted">Ordered ${p.ordered} · ETA ${p.eta}</span></div></div><button class="x" aria-label="Close" onclick="App.closeModal()">${ic('x')}</button></div>
  <div class="steps">${PO_STEPS.map((s,i)=>`<span class="st ${i<=idx?'done':''}">${i+1}. ${s}</span>`).join('')}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Part no.</th><th>Description</th><th class="num">Qty</th><th class="num">Unit FOB (USD)</th><th class="num">Line FOB (USD)</th><th class="num">Landed / unit (ETB)</th></tr></thead><tbody>
  ${p.lines.map(l=>{const pt=part(l.sku);return`<tr><td class="mono">${esc(pt.pn)}</td><td>${esc(pt.name)}</td><td class="num">${l.qty}</td><td class="num">${l.usd.toFixed(2)}</td><td class="num">${fmt(l.qty*l.usd)}</td><td class="num"><b>${fmt(l.usd*S.fx*L.factor)}</b></td></tr>`}).join('')}</tbody></table></div>
  <div class="grid two" style="margin-top:14px">
   <div class="sect"><h3>Landed cost breakdown</h3>
    <div class="totals" style="max-width:none">
     <div><span>FOB value</span><span>${usd(L.fob)}</span></div>
     <div><span>Sea freight</span><span>${usd(p.freightUSD)}</span></div>
     <div><span>Insurance</span><span>${usd(p.insUSD)}</span></div>
     <div><b>CIF value</b><b>${usd(L.cifUSD)} · ${etb(L.cifETB)}</b></div>
     <div><span>Customs duty (${p.dutyPct}%)</span><span>${etb(L.duty)}</span></div>
     <div><span>Surtax (10%)</span><span>${etb(L.surtax)}</span></div>
     <div><span>Clearing, Djibouti–Modjo transport, port fees</span><span>${etb(p.clearingETB)}</span></div>
     <div class="grand"><span>Landed cost</span><span>${etb(L.landedETB)}</span></div>
     <div class="small muted"><span>≈ ${usd(L.landedUSD)} · cost factor ×${L.factor.toFixed(2)} on FOB</span></div>
    </div></div>
   <div class="sect"><h3>Recoverable at customs (not in landed cost)</h3>
    <div class="totals" style="max-width:none"><div><span>Import VAT 15%</span><span>${etb(L.vat)}</span></div><div><span>Withholding 3%</span><span>${etb(L.wht)}</span></div></div>
    <p class="small muted">Rates are illustrative demo assumptions at 1 USD = ${S.fx} ETB. In the real system duty rates are set per HS code and the actual customs declaration amounts are entered.</p>
    <div class="row-actions">${idx<3?`<button class="btn" onclick="App.advancePO('${p.no}')">Mark as “${PO_STEPS[idx+1]}”</button>`:idx===3?`<button class="btn" onclick="App.receivePO('${p.no}')">${ic('check')}Receive into stock</button>`:'<span class="badge b-green">Received & stocked</span>'}</div>
   </div></div>`);
}
function advancePO(no){const p=S.pos.find(x=>x.no===no);p.status=PO_STEPS[PO_STEPS.indexOf(p.status)+1];save();toast(`${no}: ${p.status}`);poModal(no);if(location.hash.includes('purchases'))route()}
function receivePO(no){const p=S.pos.find(x=>x.no===no);const L=landed(p);
  p.lines.forEach(l=>{const pt=part(l.sku);const unit=l.usd*S.fx*L.factor;pt.cost=Math.round((pt.cost*pt.qty+unit*l.qty)/(pt.qty+l.qty));pt.qty+=l.qty;S.moves.unshift({id:uid('MV'),date:today(),sku:l.sku,type:'PURCHASE',qty:l.qty,ref:no,wh:pt.wh,user:'Store Keeper'})});
  p.status='Received';save();toast(`${no} received – stock & average cost updated`);poModal(no);route()}
function setFx(){const v=parseFloat(prompt('Exchange rate: 1 USD = ? ETB',S.fx));if(v>0){S.fx=v;save();route()}}
function newPO(){

  <div><label>Qty</label><input id="po_qty" type="number" class="full" value="20"></div><div><label>Unit FOB (USD)</label><input id="po_usd" type="number" class="full" value="60"></div>
  <div><label>Freight (USD)</label><input id="po_fr" type="number" class="full" value="600"></div><div><label>Insurance (USD)</label><input id="po_ins" type="number" class="full" value="40"></div>
  <div><label>Customs duty %</label><input id="po_duty" type="number" class="full" value="20"></div><div><label>Clearing & transport (ETB)</label><input id="po_cl" type="number" class="full" value="45000"></div></div>
  <div class="row-actions" style="margin-top:14px"><button class="btn" onclick="App.savePO()">Create PO</button></div>`);
}
function savePO(){const g=id=>$('#'+id).value;S.seq.PO++;const no='PO-'+S.seq.PO;
  S.pos.push({no,sup:g('po_sup'),status:'Ordered',ordered:today(),eta:daysAgo(-45),lines:[{sku:g('po_sku'),qty:+g('po_qty'),usd:+g('po_usd')}],freightUSD:+g('po_fr'),insUSD:+g('po_ins'),dutyPct:+g('po_duty'),clearingETB:+g('po_cl'),route:'Djibouti → Modjo dry port → Addis'});
  save();toast(no+' created');route();poModal(no)}

let draft=null;
VIEWS.sales=(pr)=>{
  if(pr.get('new'))setTimeout(()=>newQuote(),0);
  const tab=pr.get('tab')||'all';
  let docs=S.docs.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no));
  if(tab==='Q')docs=docs.filter(d=>d.type==='Q');if(tab==='INV')docs=docs.filter(d=>d.type==='INV');if(tab==='unpaid')docs=docs.filter(d=>d.type==='INV'&&d.paid<d.total);
  return`<div class="toolbar"><div class="tabs">${[['all','All'],['Q','Quotations'],['INV','Invoices'],['unpaid','Unpaid']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="location.hash='#/sales?tab=${k}'">${l}</button>`).join('')}</div><div class="grow"></div><button class="btn" onclick="App.newQuote()">${ic('plus')}New quotation</button></div>
  <div class="card" style="padding:0"><div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Date</th><th>Customer</th><th class="num hide-m">Subtotal</th><th class="num hide-m">VAT 15%</th><th class="num">Total (ETB)</th><th>Status</th></tr></thead><tbody>
  ${docs.map(d=>`<tr class="click" onclick="App.docModal('${d.no}')"><td><b>${d.no}</b><div class="small muted">${d.type==='Q'?'Quotation':'Tax invoice'}</div></td><td>${d.date}</td><td>${esc(cust(d.cust).name)}</td><td class="num hide-m">${fmt(d.sub)}</td><td class="num hide-m">${fmt(d.vat)}</td><td class="num"><b>${fmt(d.total)}</b></td><td>${statusBadge(d.type==='Q'?d.status:invStatus(d))}</td></tr>`).join('')}
  </tbody></table></div></div>`;
};
function newQuote(sku){
  draft={cust:'C-101',lines:[]};if(sku){const p=part(sku);draft.lines.push({sku,desc:p.name,pn:p.pn,qty:1,price:p.price})}
  renderDraft();
}
function renderDraft(){
  const sub=draft.lines.reduce((a,l)=>a+l.qty*l.price,0),vat=Math.round(sub*VAT);
  modal(`<div class="modal-head"><div><div class="small muted">Draft</div><h2>New quotation</h2></div><button class="x" aria-label="Close" onclick="App.closeModal()">${ic('x')}</button></div>
  <div class="form"><div><label>Customer</label><select class="full" onchange="App.draftSet('cust',this.value)">${S.customers.map(c=>`<option value="${c.id}" ${c.id===draft.cust?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
  <div style="grid-column:span 2"><label>Add part (search part no., brand or machine)</label><input class="full" id="qSearch" placeholder="Type e.g. PC200 or 3802376…" oninput="App.qSuggest(this.value)" autocomplete="off"><div id="qSug" class="sug"></div></div></div>
  <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th class="hide-m">Part no.</th><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num hide-m">Line total</th><th></th></tr></thead><tbody>
  ${draft.lines.map((l,i)=>{const p=part(l.sku);return`<tr><td class="mono hide-m">${esc(l.pn)}</td><td style="white-space:normal;min-width:120px">${esc(l.desc)}<div class="mono small show-m">${esc(l.pn)}</div><div class="small ${p.qty<l.qty?'warn':'muted'}">${p.qty} in stock${p.qty<l.qty?' – not enough!':''}</div></td><td class="num"><input type="number" min="1" value="${l.qty}" style="width:62px" aria-label="Quantity" onchange="App.draftLine(${i},'qty',this.value)"></td><td class="num"><input type="number" value="${l.price}" style="width:96px" aria-label="Unit price" onchange="App.draftLine(${i},'price',this.value)"></td><td class="num hide-m"><b>${fmt(l.qty*l.price)}</b></td><td><button class="x" aria-label="Remove line" onclick="App.draftDel(${i})">${ic('x')}</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted" style="padding:18px">Search above to add parts.</td></tr>'}
  </tbody></table></div>
  <div class="totals" style="margin-top:12px"><div><span>Subtotal</span><span>${etb(sub)}</span></div><div><span>VAT 15%</span><span>${etb(vat)}</span></div><div class="grand"><span>Total</span><span>${etb(sub+vat)}</span></div></div>
  <div class="row-actions" style="margin-top:14px;justify-content:flex-end"><button class="btn" ${draft.lines.length?'':'disabled'} onclick="App.saveQuote()">Save quotation</button></div>`);
  setTimeout(()=>{const q=$('#qSearch');if(q)q.focus()},30);
}
function qSuggest(v){const q=v.toLowerCase().replace(/\s|-/g,'');if(q.length<2){$('#qSug').innerHTML='';return}
  const r=S.parts.filter(p=>(p.pn+p.name+p.brand+p.models.join(' ')).toLowerCase().replace(/\s|-/g,'').includes(q)).slice(0,6);
  $('#qSug').innerHTML=r.map(p=>`<div class="sug-i" onclick="App.draftAdd('${p.sku}')"><span class="mono">${esc(p.pn)}</span> ${esc(p.name)} <span class="muted small">· ${p.qty} in stock · ${etb(p.price)}</span></div>`).join('')||'<div class="sug-i muted">No match</div>'}
function draftAdd(sku){const p=part(sku);const ex=draft.lines.find(l=>l.sku===sku);if(ex)ex.qty++;else draft.lines.push({sku,desc:p.name,pn:p.pn,qty:1,price:p.price});renderDraft()}
function draftLine(i,k,v){draft.lines[i][k]=Math.max(k==='qty'?1:0,+v);renderDraft()}
function draftDel(i){draft.lines.splice(i,1);renderDraft()}
function draftSet(k,v){draft[k]=v}
function saveQuote(){const d=mkDoc('Q',S,draft.cust,draft.lines,today());S.docs.push(d);save();toast(d.no+' saved');location.hash='#/sales?tab=Q';setTimeout(()=>docModal(d.no),50)}
function quickQuote(sku){newQuote(sku)}
function docModal(no){
  const d=S.docs.find(x=>x.no===no);const c=cust(d.cust);const st=d.type==='Q'?d.status:invStatus(d);
  modal(`<div class="modal-head"><div><div class="small muted">${d.type==='Q'?'Quotation':'Tax invoice'} · ${d.date}</div><h2>${d.no} · ${esc(c.name)}</h2><div style="margin-top:6px">${statusBadge(st)} ${d.from?`<span class="small muted">from ${d.from}</span>`:''}${d.convertedTo?`<span class="small muted">→ ${d.convertedTo}</span>`:''}</div></div><button class="x" aria-label="Close" onclick="App.closeModal()">${ic('x')}</button></div>
  ${docHTML(d)}
  <div class="row-actions" style="margin-top:14px">
   ${d.type==='Q'&&d.status==='Open'?`<button class="btn" onclick="App.convert('${d.no}')">${ic('arrow')}Convert to invoice</button>`:''}
   ${d.type==='INV'&&d.paid<d.total?`<button class="btn" onclick="App.pay('${d.no}')">${ic('cash')}Record payment</button>`:''}
   <button class="btn ghost" onclick="App.printDoc('${d.no}')">${ic('printer')}Print / save PDF</button>
  </div>`);
}

function convert(no){
  const q=S.docs.find(x=>x.no===no);
  const short=q.lines.filter(l=>part(l.sku).qty<l.qty);
  if(short.length)return toast('Not enough stock for '+short.map(l=>l.pn).join(', '));
  const inv=mkDoc('INV',S,q.cust,q.lines.map(l=>({...l})),today());inv.from=q.no;q.status='Converted';q.convertedTo=inv.no;S.docs.push(inv);
  inv.lines.forEach(l=>{const p=part(l.sku);p.qty-=l.qty;S.moves.unshift({id:uid('MV'),date:today(),sku:l.sku,type:'SALE',qty:-l.qty,ref:inv.no,wh:p.wh,user:'Parts Desk'})});
  cust(q.cust).balance+=inv.total;save();toast(`${inv.no} issued · stock deducted`);docModal(inv.no);if(location.hash.includes('sales'))route()}
function pay(no){const d=S.docs.find(x=>x.no===no);const due=d.total-d.paid;const v=parseFloat(prompt(`Record payment for ${no}\nBalance due ETB ${fmt(due)}. Amount received:`,due));if(!(v>0))return;
  const a=Math.min(v,due);d.paid+=a;cust(d.cust).balance-=a;S.payments.unshift({date:today(),doc:no,cust:d.cust,amount:a});save();toast('Payment recorded');docModal(no);if(location.hash.includes('sales')||location.hash.includes('customers'))route()}
function printDoc(no){const d=S.docs.find(x=>x.no===no);$('#printArea').innerHTML=docHTML(d);setTimeout(()=>window.print(),100)}

/* ---------- CUSTOMERS ---------- */
VIEWS.customers=()=>`
  <div class="card kpis grid" style="margin-bottom:16px"><div class="metric"><div class="lbl">Total receivables</div><div class="v">${etb(S.customers.reduce((a,c)=>a+c.balance,0))}</div></div>
  <div class="metric"><div class="lbl">Over credit limit</div>${(()=>{const n=S.customers.filter(c=>c.limit&&c.balance>c.limit).length;return`<div class="v" style="color:${n?'var(--bad)':'inherit'}">${n}</div><div class="s">${S.customers.filter(c=>c.limit&&c.balance>c.limit*0.9).length} above 90% of limit</div>`})()}</div>
  <div class="metric"><div class="lbl">Active customers</div><div class="v">${S.customers.length}</div></div></div>
  <div class="card" style="padding:0"><div class="tbl-wrap"><table><thead><tr><th>Customer</th><th class="hide-m">City</th><th class="hide-m">Phone</th><th class="num">Credit limit</th><th class="num">Balance due</th><th>Credit used</th></tr></thead><tbody>
  ${S.customers.map(c=>{const pct=c.limit?Math.min(100,c.balance/c.limit*100):0;return`<tr class="click" onclick="App.custModal('${c.id}')"><td><b>${esc(c.name)}</b><div class="small muted">${c.id} · TIN ${esc(c.tin)}</div></td><td class="hide-m">${esc(c.city)}</td><td class="hide-m">${esc(c.phone)}</td><td class="num">${c.limit?fmt(c.limit):'Cash only'}</td><td class="num"><b>${fmt(c.balance)}</b></td><td style="min-width:120px">${c.limit?`<div class="bar"><i style="width:${pct}%;background:${pct>90?'#b42020':pct>60?'#c07a00':'#1f8a4c'}"></i></div><div class="small muted">${Math.round(pct)}%</div>`:'—'}</td></tr>`}).join('')}
  </tbody></table></div></div>`;
function custModal(id){const c=cust(id);const docs=S.docs.filter(d=>d.cust===id).sort((a,b)=>b.date.localeCompare(a.date));
  modal(`<div class="modal-head"><div><div class="small muted">${c.id} · ${esc(c.city)} · ${esc(c.phone)}</div><h2>${esc(c.name)}</h2></div><button class="x" aria-label="Close" onclick="App.closeModal()">${ic('x')}</button></div>
  <div class="kv"><div><label>Credit limit</label><b>${c.limit?etb(c.limit):'Cash only'}</b></div><div><label>Balance due</label><b>${etb(c.balance)}</b></div><div><label>Available credit</label><b>${c.limit?etb(Math.max(0,c.limit-c.balance)):'—'}</b></div><div><label>Lifetime sales</label><b>${etb(docs.filter(d=>d.type==='INV').reduce((a,d)=>a+d.total,0))}</b></div></div>
  <h4>Statement</h4><div class="tbl-wrap"><table><thead><tr><th>Doc</th><th>Date</th><th class="num">Total</th><th class="num">Paid</th><th>Status</th></tr></thead><tbody>${docs.map(d=>`<tr class="click" onclick="App.docModal('${d.no}')"><td><b>${d.no}</b></td><td>${d.date}</td><td class="num">${fmt(d.total)}</td><td class="num">${d.type==='INV'?fmt(d.paid):'—'}</td><td>${statusBadge(d.type==='Q'?d.status:invStatus(d))}</td></tr>`).join('')}</tbody></table></div>`)}

function moveBadge(t){const m={SALE:'b-red',PURCHASE:'b-green',ADJUSTMENT:'b-amber',TRANSFER:'b-blue',OPENING:'b-grey'};return`<span class="badge ${m[t]}">${t}</span>`}
VIEWS.movements=(pr)=>{const t=pr.get('t')||'';const mv=S.moves.filter(m=>!t||m.type===t).slice(0,150);
  return`<div class="toolbar"><div class="tabs">${[['','All'],['SALE','Sales'],['PURCHASE','Purchases'],['TRANSFER','Transfers'],['ADJUSTMENT','Adjustments']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="location.hash='#/movements?t=${k}'">${l}</button>`).join('')}</div><div class="grow"></div><button class="btn ghost" onclick="App.csv('moves')">${ic('download')}Export CSV</button></div>
  <div class="card" style="padding:0"><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Part no.</th><th>Description</th><th class="num">Qty</th><th>Reference</th><th class="hide-m">Location</th><th class="hide-m">User</th></tr></thead><tbody>
  ${mv.map(m=>{const p=part(m.sku);return`<tr class="click" onclick="App.partModal('${m.sku}')"><td>${m.date}</td><td>${moveBadge(m.type)}</td><td class="mono">${esc(p.pn)}</td><td class="trunc" style="max-width:260px">${esc(p.name)}</td><td class="num"><b style="color:${m.qty<0?'#b42020':'#1f8a4c'}">${m.qty>0?'+':''}${m.qty}</b></td><td>${esc(m.ref)}</td><td class="hide-m">${m.wh==='NSL'?'Main Yard':'Gofa Counter'}</td><td class="hide-m">${esc(m.user)}</td></tr>`}).join('')}
  </tbody></table></div><div class="tfoot small muted">Showing ${mv.length} movements · every sale, receipt, transfer and adjustment is logged automatically.</div></div>`};

/* ---------- REPORTS ---------- */
VIEWS.reports=()=>{
  const inv=S.docs.filter(d=>d.type==='INV');
  const byBrand={};inv.forEach(d=>d.lines.forEach(l=>{const b=part(l.sku).brand;byBrand[b]=(byBrand[b]||0)+l.qty*l.price}));
  const bb=Object.entries(byBrand).sort((a,b)=>b[1]-a[1]);const mb=bb[0]?bb[0][1]:1;
  const byCat={};S.parts.filter(p=>p.cat!=='Machines').forEach(p=>{byCat[p.cat]=(byCat[p.cat]||0)+p.qty*p.cost});const machV=S.parts.filter(p=>p.cat==='Machines').reduce((a,p)=>a+p.qty*p.cost,0);const bc=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const mc=bc[0][1];
  const sold=new Set();inv.filter(d=>d.date>=daysAgo(90)).forEach(d=>d.lines.forEach(l=>sold.add(l.sku)));
  const slow=S.parts.filter(p=>!sold.has(p.sku)&&p.qty>0).sort((a,b)=>b.qty*b.cost-a.qty*a.cost).slice(0,8);
  const aging=[0,0,0,0];inv.forEach(d=>{const due=d.total-d.paid;if(due<=0)return;const age=(Date.now()-new Date(d.date))/864e5;aging[age<=30?0:age<=60?1:age<=90?2:3]+=due});
  const gp=inv.reduce((a,d)=>a+d.lines.reduce((x,l)=>x+l.qty*(l.price-part(l.sku).cost),0),0),rev=inv.reduce((a,d)=>a+d.sub,0);
  return`<div class="card kpis grid" style="margin-bottom:16px"><div class="metric"><div class="lbl">Revenue (6 mo, excl. VAT)</div><div class="v">${etb(rev)}</div></div><div class="metric"><div class="lbl">Gross profit</div><div class="v">${etb(gp)}</div><div class="s">${Math.round(gp/rev*100)}% margin</div></div><div class="metric"><div class="lbl">VAT collected (output)</div><div class="v">${etb(inv.reduce((a,d)=>a+d.vat,0))}</div><div class="s">for monthly VAT return</div></div><div class="metric"><div class="lbl">Invoices</div><div class="v">${inv.length}</div></div></div>
  <div class="grid two"><div class="card"><div class="card-h"><h3>Sales by brand</h3><button class="btn ghost sm" onclick="App.csv('brand')">${ic('download')}CSV</button></div>${bb.map(([b,v])=>`<div class="barrow"><div>${brandTag(b)}</div><div class="bar"><i style="width:${v/mb*100}%"></i></div><div class="num">${etb(v)}</div></div>`).join('')}</div>
  <div class="card"><div class="card-h"><h3>Stock value by category <span class="small muted" style="font-weight:400">· plus ${etb(machV)} in machines</span></h3><button class="btn ghost sm" onclick="App.csv('stock')">${ic('download')}CSV</button></div>${bc.map(([b,v])=>`<div class="barrow"><div class="trunc">${esc(b)}</div><div class="bar"><i style="width:${v/mc*100}%;background:var(--ink)"></i></div><div class="num">${etb(v)}</div></div>`).join('')}</div></div>
  <div class="grid two" style="margin-top:14px"><div class="card"><h3>Receivables aging</h3><div class="kv" style="margin:0">${['0–30 days','31–60 days','61–90 days','Over 90 days'].map((l,i)=>`<div><label>${l}</label><b style="color:${i>1?'var(--bad)':'inherit'}">ETB ${fmt(aging[i])}</b></div>`).join('')}</div><p class="small muted" style="margin:12px 0 0">Unpaid invoice balances by age. Customers with balances over 60 days are flagged on their statement.</p></div>
  <div class="card"><h3>Slow-moving stock <span class="small muted">(no sales in 90 days)</span></h3><div class="tbl-wrap"><table><tbody>${slow.map(p=>`<tr class="click" onclick="App.partModal('${p.sku}')"><td class="mono">${esc(p.pn)}</td><td style="white-space:normal">${esc(p.name)}</td><td class="num">${p.qty}</td><td class="num">${etb(p.qty*p.cost)}</td></tr>`).join('')}</tbody></table></div></div></div>`};

function csv(kind){let rows=[];
  if(kind==='moves')rows=[['date','type','part_no','description','qty','reference','location']].concat(S.moves.map(m=>[m.date,m.type,part(m.sku).pn,part(m.sku).name,m.qty,m.ref,S.warehouses[m.wh]]));
  if(kind==='stock')rows=[['sku','part_no','brand','category','description','location','bin','qty','reorder','cost_etb','price_etb','value_etb']].concat(S.parts.map(p=>[p.sku,p.pn,p.brand,p.cat,p.name,S.warehouses[p.wh],p.bin,p.qty,p.reorder,p.cost,p.price,p.qty*p.cost]));
  if(kind==='brand'){const by={};S.docs.filter(d=>d.type==='INV').forEach(d=>d.lines.forEach(l=>{const b=part(l.sku).brand;by[b]=(by[b]||0)+l.qty*l.price}));rows=[['brand','sales_etb']].concat(Object.entries(by))}
  const blob=new Blob([rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`stepping-stone-${kind}-${today()}.csv`;a.click();toast('CSV downloaded')}
function globalSearch(v){location.hash='#/inventory?q='+encodeURIComponent(v)}
function resetDemo(){if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);load();route();toast('Demo data reset')}}

window.App={partModal,closeModal,filterInv,adjust,transfer,newPart,savePart,poModal,advancePO,receivePO,setFx,newPO,savePO,newQuote,qSuggest,draftAdd,draftLine,draftDel,draftSet,saveQuote,quickQuote,docModal,convert,pay,printDoc,custModal,csv,globalSearch,resetDemo};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){const g=$('#globalSearch');if(g&&g.offsetParent){e.preventDefault();g.focus()}}});
load();route();
})();
</script>
